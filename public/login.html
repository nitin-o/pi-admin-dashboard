<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b1120">
    <title>PI ADMIN | Secure Login</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="login-page">
    <main class="login-container">
        <section class="login-card">
            <div class="login-brand">
                <span class="brand-icon">π</span>
                <h1>PI ADMIN</h1>
                <p>RASPBERRY PI MANAGEMENT</p>
            </div>

            <div class="login-heading">
                <p class="eyebrow">SYSTEM ACCESS</p>
                <h2>Welcome Back</h2>
                <p>Sign in to access your Raspberry Pi dashboard.</p>
            </div>

            <form id="loginForm">
                <label for="username">USERNAME</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    autocomplete="username"
                    maxlength="100"
                    required
                >

                <label for="password">PASSWORD</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    autocomplete="current-password"
                    maxlength="1024"
                    required
                >

                <p id="loginError" class="login-error" role="alert"></p>

                <button type="submit" id="loginButton">
                    SIGN IN
                </button>
            </form>

            <div class="login-footer">
                <span class="status-dot"></span>
                SECURE ADMIN ACCESS
            </div>
        </section>
    </main>

    <script src="/js/login.js"></script>
</body>
</html>
